[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "board_game_concept"
version = "0.1.0"
description = "Board game concept library and server/client framework."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML"]
authors = [{name = "Rose Burston"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["board_game_concept", "board_game_concept.*"]

[project.scripts]
bgcclient = "board_game_concept.cli.bgcclient:main"
bgcserver = "board_game_concept.cli.bgcserver:main"
bgcobserver = "board_game_concept.cli.bgcobserver:main"

[project.optional-dependencies]
dev = ["pylint>=4.0.0,<5.0.0"]
