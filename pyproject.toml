[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "board_game_concept"
version = "0.1.0"
description = "Board game concept library and server/client framework."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML", "flask", "requests"]
authors = [{name = "Rose Burston"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["board_game_concept", "board_game_concept.*"]

[tool.setuptools.package-data]
# every .sql beside the storage package, rather than a list of them:
# `accounts.sql` was added and this was not, so a non-editable install
# had no schema to apply and every request failed
"board_game_concept.storage" = ["*.sql"]

[project.scripts]
bgcclient = "board_game_concept.cli.bgcclient:main"
bgcserver = "board_game_concept.cli.bgcserver:main"
bgcobserver = "board_game_concept.cli.bgcobserver:main"
bgcapiserver = "board_game_concept.http.bgcapiserver:main"

[project.optional-dependencies]
dev = ["pylint>=4.0.0,<5.0.0"]
