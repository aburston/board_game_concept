# Heavies: seven Heavies, a Keep and a Runner.
#
# The dearest thing in the catalogue, seven times: attack 5, health 10,
# energy 15, compute 4, thirty-four points and a fare of three. Nothing in
# the stock army destroys a Heavy in one exchange short of two Lances
# arriving together, and a Heavy's five destroys a Pawn, a Runner, a Scout
# or a Lance outright and a Line in two.
#
# Fifteen energy against a fare of three and a strike of five is three
# squares, then two turns' rest for every further one - and the board is
# eight rows, so a Heavy that starts on the frontier row is four squares
# from the far edge. The Heavies hunt; the Keep and the Runner hold the
# edge.
name: Heavies
doctrine: 7 x Heavy (a5 h10 e15 c4) + Keep with the flag + Runner; the Heavies hunt
rebuild: true
types:
  - {name: Heavy, symbol: H, attack: 5, health: 10, energy: 15, compute: 4, program: programs/hunter8.asm}
  - {name: Keep, symbol: K, attack: 1, health: 10, energy: 5, compute: 8, program: programs/warden.asm}
  - {name: Runner, symbol: r, attack: 2, health: 4, energy: 10, compute: 5, program: programs/hold.asm}
units:
  - [Heavy, heavy1, 1, 3]
  - [Heavy, heavy2, 2, 3]
  - [Heavy, heavy3, 3, 3]
  - [Heavy, heavy4, 4, 3]
  - [Heavy, heavy5, 5, 3]
  - [Heavy, heavy6, 6, 3]
  - [Heavy, heavy7, 4, 2]
  - [Keep, keep1, 3, 0]
  - [Runner, runner1, 4, 0]
flag: keep1
