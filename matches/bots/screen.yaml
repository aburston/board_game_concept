# Screen: the stock army, with the Scouts put in the way.
#
# A Scout is attack 0, health 2, energy 12, compute 6, for twenty points: it
# strikes nothing, but it holds a square like anything else and has twelve
# squares of walking in it. This doctrine walks the two Scouts to the
# frontier row in the two middle columns - the straight line from the
# enemy's half to the Keeps - round their own units, and leaves them there.
# Anything coming for the flag has to spend a strike on a body that cost
# twenty points, and fall back to do it (R5.8), before it can take the
# square. Everything else plays as Advance does.
name: Screen
doctrine: the stock army; the Scouts stand on the frontier row in front of the Keeps, the rest play as Advance
programs:
  Scout: programs/screen.asm
  Pawn: programs/advance2.asm
  Heavy: programs/advance8.asm
  Runner: programs/hold.asm
  Line: programs/hold.asm
  Keep: programs/hold.asm
